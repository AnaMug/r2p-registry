<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2733">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>R2P Maintenance Incendie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="R2P Incendie">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧯</text></svg>">
<style>
:root{
  --bg:#eceff2;--panel:#ffffff;--panel2:#f5f7f9;--text:#17212b;--mut:#5e6b78;--line:#d6dce2;
  --red:#d11f2c;--red2:#e3202f;--green:#237f52;--amber:#d98a0b;--blue:#1f5f99;
  --nav:#1c2733;--nav2:#243240;--navt:#b9c4cf;
  --r1:6px;--r2:12px;
  --font:Bahnschrift,"DIN Alternate","DIN Next","Barlow","Segoe UI",Roboto,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#10171e;--panel:#18222c;--panel2:#1e2a35;--text:#e6ebf0;--mut:#8d9aa7;--line:#2b3947;
  --nav:#0c1217;--nav2:#16202a;--navt:#98a6b3;--red2:#e24a39;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{display:grid;grid-template-columns:240px 1fr;height:100vh;height:100dvh}
#nav{background:var(--nav);color:var(--navt);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:#fff}
.brand .mk{width:40px;height:40px;background:var(--red);border-radius:var(--r1);display:grid;place-items:center;font-size:22px;flex:none}
.brand b{display:block;font-size:17px;letter-spacing:.2px}.brand small{color:var(--navt);font-size:12px}
.nb{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:var(--r1);cursor:pointer;text-align:left;color:var(--navt);font-size:15px;border-left:4px solid transparent}
.nb:hover{background:var(--nav2)}
.nb.on{background:var(--nav2);color:#fff;border-left-color:var(--red2)}
.nb .i{font-size:19px;width:24px;text-align:center}
.nb .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:12px;border-radius:10px;padding:1px 7px}
.navfoot{margin-top:auto;font-size:12px;padding:12px 8px 0;border-top:1px solid var(--nav2)}
main{overflow:auto;height:100%;position:relative}
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line)}
#top h1{margin:0;font-size:22px;font-weight:700;flex:1}
.net{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
#view{padding:22px 24px 110px;max-width:1280px}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 16px;border-radius:var(--r1);cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:13px}.mt{margin-top:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.ph1{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph1 p{margin:2px 0 0;color:var(--mut)}
.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:13px;font-weight:600;white-space:nowrap;border-left:4px solid}
.badge.ok{background:rgba(35,127,82,.12);color:var(--green);border-color:var(--green)}
.badge.warn{background:rgba(217,138,11,.14);color:var(--amber);border-color:var(--amber)}
.badge.bad{background:rgba(175,43,30,.12);color:var(--red2);border-color:var(--red2)}
.badge.info{background:rgba(31,95,153,.12);color:var(--blue);border-color:var(--blue)}
.badge.mut{background:var(--panel2);color:var(--mut);border-color:var(--line)}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:13px;font-weight:600}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;border-top:5px solid var(--line);cursor:pointer}
.kpi .n{font-size:34px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--mut);font-size:14px}
.kpi.bad{border-top-color:var(--red2)}.kpi.warn{border-top-color:var(--amber)}.kpi.ok{border-top-color:var(--green)}.kpi.info{border-top-color:var(--blue)}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.bar{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar .t{height:12px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--red)}
.gauge{height:14px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:8px 0}
.gauge i{display:block;height:100%;background:var(--green)}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r1);background:rgba(217,138,11,.13);border-left:5px solid var(--amber);margin-bottom:14px}
/* lists */
.eq{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.eq:last-child{border-bottom:0}
.ico{width:44px;height:44px;border-radius:var(--r1);background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;flex:none}
.right{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r1);padding:0 10px;max-width:260px}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:var(--r1);cursor:pointer;font-weight:600}
.tab.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:12px}
.site{border:1px solid var(--line);border-radius:var(--r1);padding:12px;background:var(--panel2)}
.empty{text-align:center;padding:48px 20px}
.empty .big{font-size:52px}
/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px}
.fld>span{color:var(--mut);font-weight:600}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--panel);border-radius:var(--r1);padding:10px;min-height:44px;width:100%}
.fld textarea{resize:vertical}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#modal.hidden{display:none}
.mbox{background:var(--panel);border-radius:var(--r2);width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:19px}
#mbody{padding:18px 20px;overflow:auto}
.mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--panel);padding:12px 20px;border-radius:var(--r1);z-index:60;transition:transform .25s;font-weight:600}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
/* visit */
.vi{padding:0;overflow:hidden;border-left:6px solid var(--line)}
.vi.rC{border-left-color:var(--green)}.vi.rNC{border-left-color:var(--red2)}
.vi .hd{padding:14px 16px;cursor:pointer}
.chk{padding:0 16px 16px;border-top:1px solid var(--line);background:var(--panel2)}
.pt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tri{display:flex;flex:none}
.tri button{min-width:56px;min-height:42px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700}
.tri button:first-child{border-radius:var(--r1) 0 0 var(--r1)}.tri button:last-child{border-radius:0 var(--r1) var(--r1) 0}
.tri button.on.C{background:var(--green);color:#fff;border-color:var(--green)}
.tri button.on.NC{background:var(--red2);color:#fff;border-color:var(--red2)}
.tri button.on.NA{background:var(--mut);color:#fff;border-color:var(--mut)}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green)}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sig canvas{width:100%;height:150px;background:#fff;border:1px dashed var(--mut);border-radius:var(--r1);touch-action:none;display:block}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.ph{position:relative}.ph img{width:96px;height:96px;object-fit:cover;border-radius:var(--r1);border:1px solid var(--line)}
.ph button{position:absolute;top:2px;right:2px;border:0;background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer}
details.cat{border-top:1px solid var(--line);padding:10px 0}
details.cat summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center}
details.cat ul{margin:8px 0 0 56px;color:var(--mut);font-size:14px}
.freq{width:70px;min-height:38px;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);padding:0 8px}
h2.sec{font-size:17px;margin:22px 0 10px;color:var(--mut);font-weight:600}
#print{display:none}
#top{flex-wrap:wrap}
.eq.rdv{flex-wrap:wrap}.eq.rdv .grow{min-width:220px}
.eq.rdv .acts{margin-left:auto}
a.btn{text-decoration:none;color:inherit}
.brand{flex-wrap:wrap}.brand img{height:42px;max-width:100%;object-fit:contain;flex:none;display:block;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:12px;color:var(--mut);text-align:center;font-weight:600}
.cal .d{min-height:84px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r1);padding:4px;cursor:pointer;font-size:12px;overflow:hidden}
.cal .d.o{opacity:.4}.cal .d.t{border:2px solid var(--red2)}.cal .d.sel{outline:3px solid var(--blue);outline-offset:-1px}
.cal .ev{color:#fff;border-radius:3px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.tw{overflow-x:auto}
.lines{width:100%;border-collapse:collapse;min-width:980px}
.lines th{font-size:13px;color:var(--mut);text-align:left;padding:6px}
.lines td{padding:4px;border-top:1px solid var(--line);vertical-align:top}
.lines input,.lines textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r1);padding:8px;min-height:40px}
.tot{margin-left:auto;min-width:280px;background:var(--panel2);border-radius:var(--r1);padding:10px 14px}
.tot div{display:flex;justify-content:space-between;gap:20px;padding:3px 0}
.tot .big{font-size:20px;font-weight:700;border-top:2px solid var(--text);padding-top:8px;margin-top:4px}
.sub{grid-column:1/-1;margin:10px 0 0;font-size:15px;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:4px}
.art{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.art input{min-height:40px;border:1px solid var(--line);border-radius:var(--r1);padding:0 8px;background:var(--panel);min-width:0}
@media (max-width:900px){.cal .d{min-height:54px}.cal .ev{font-size:0;height:6px;padding:0}.tot{min-width:0;width:100%}}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #nav{order:2;flex-direction:row;padding:6px;overflow-x:auto;gap:2px;height:auto}
  .brand,.navfoot{display:none}
  .nb{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;border-left:0;border-top:3px solid transparent;min-width:70px;align-items:center}
  .nb.on{border-top-color:var(--red2)}
  .nb .cnt{position:absolute;margin:0 0 0 30px}
  .cols,.grid2,.sigs{grid-template-columns:1fr}
  #view{padding:16px 14px 40px}#top{padding:12px 14px}
  .bar{grid-template-columns:110px 1fr 36px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000}
  #app,#modal,#toast{display:none!important}
  #print{display:block;font-size:11px;color:#000}
  #print h1{font-size:18px;margin:0}
  #print h2{font-size:13px;margin:14px 0 6px;border-bottom:2px solid #af2b1e;padding-bottom:3px}
  #print table{width:100%;border-collapse:collapse;margin-bottom:8px}
  #print th,#print td{border:1px solid #999;padding:4px 5px;vertical-align:top;text-align:left}
  #print th{background:#eee}
  .pr-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #af2b1e;padding-bottom:8px;margin-bottom:10px}
  .pr-h>div:first-child{display:flex;gap:10px}
  .pr-logo{max-height:60px;max-width:120px}
  .pr-t{text-align:right}
  .pr-sig{display:flex;gap:20px}.pr-sig div{flex:1;border:1px solid #999;min-height:90px;padding:5px}
  .pr-sig img{max-height:80px}
  .C{color:#237f52;font-weight:700}.NC{color:#af2b1e;font-weight:700}
  tr{page-break-inside:avoid}
  .pr-legal{font-size:9px;color:#555;border-top:1px solid #999;margin-top:14px;padding-top:5px;text-align:center}
  .pr-ph img{max-width:32%;max-height:170px;margin:2px}
}
</style>
</head>

  <aside id="nav"></aside>
  <main id="main"><header id="top"></header><div id="view"></div></main>

<div id="print"></div>

function sigG(cid,obj,prop,ro){const c=document.getElementById(cid);if(!c||!obj)return;const ctx=c.getContext('2d'),ratio=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*ratio;c.height=h*ratio;ctx.scale(ratio,ratio);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#10202e';
 if(obj[prop]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,w,h);im.src=obj[prop]}
 if(ro)return;let dr=false;const pos=ev=>{const r=c.getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top]};
 c.onpointerdown=ev=>{dr=true;c.setPointerCapture(ev.pointerId);const[x,y]=pos(ev);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke()};
 c.onpointermove=ev=>{if(!dr)return;const[x,y]=pos(ev);ctx.lineTo(x,y);ctx.stroke()};
 c.onpointerup=c.onpointercancel=()=>{if(!dr)return;dr=false;obj[prop]=c.toDataURL('image/png');save()}}

async function dl(name,content,type){
 const blob=new Blob([content],{type});
 try{const f=new File([blob],name,{type});

 doPrint(phead('Rapport de visite n° '+esc(r.no))+pinfo(r.siteId,`<br><b>Date :</b> ${fmt(r.date)} – <b>Nature :</b> ${esc(r.kind)}<br><b>Intervenant :</b> ${esc(r.tech)}${r.persons?`<br><b>Personnes présentes :</b> ${esc(r.persons)}`:''}`)+

const QST={Brouillon:'mut',Envoyé:'info',Accepté:'ok',Refusé:'bad',Expiré:'warn'};
const QUO=()=>S.quotes.find(q=>q.id===V.qid);
const newLine=o=>Object.assign({id:uid(),kind:'line',d:'',qty:1,u:'u',pu:0,rem:0,tva:+S.company.tvaDefault||8.5},o||{});
const lineHT=l=>(+l.qty||0)*(+l.pu||0)*(1-(+l.rem||0)/100);
function qExp(q){const x=new Date(q.date+'T00:00:00');x.setDate(x.getDate()+(+q.validity||30));return iso(x)}
function qStatus(q){return (q.status==='Envoyé'||q.status==='Brouillon')&&daysTo(qExp(q))<0&&q.status==='Envoyé'?'Expiré':q.status}
function qTot(q){const k=1-(+q.disc||0)/100;let ht=0;const tv={};q.lines.forEach(l=>{if(l.kind!=='line')return;const m=lineHT(l);ht+=m;tv[+l.tva]=(tv[+l.tva]||0)+m*k*(+l.tva||0)/100});const htn=ht*k,tva=Object.values(tv).reduce((a,x)=>a+x,0),ttc=htn+tva;return{ht,rem:ht-htn,htn,tv,tva,ttc,dep:ttc*(+q.deposit||0)/100}}
function newQuote(p){if(!S.clients.length)return toast('Créez d\'abord un client',1);p=p||{};if(p.siteId&&!p.clientId)p.clientId=site(p.siteId).clientId;
 const q=Object.assign({id:uid(),no:nextNo('DEV','dev'),date:today(),validity:+S.company.validity||30,clientId:S.clients[0].id,siteId:'',object:'',intro:'',lines:[],disc:0,deposit:+S.company.deposit||0,status:'Brouillon',notes:S.company.quoteNotes||'',signer:'',sigC:''},p);
 if(!q.lines.length)q.lines.push(newLine());S.quotes.push(q);save();closeModal();go('quote',{qid:q.id})}
function dupQuote(id){const o=S.quotes.find(x=>x.id===id);const q=JSON.parse(JSON.stringify(o));Object.assign(q,{id:uid(),no:nextNo('DEV','dev'),date:today(),status:'Brouillon',signer:'',sigC:''});q.lines.forEach(l=>l.id=uid());S.quotes.push(q);save();go('quote',{qid:q.id});toast('Devis dupliqué : '+q.no)}
function delQuote(id){if(!confirm('Supprimer ce devis ?'))return;S.quotes=S.quotes.filter(q=>q.id!==id);commit('Devis supprimé')}
function totHtml(q){const t=qTot(q);return `<div><span>Total HT</span><b>${eur(t.ht)}</b></div>${t.rem?`<div><span>Remise ${num(q.disc)} %</span><b>− ${eur(t.rem)}</b></div><div><span>Net HT</span><b>${eur(t.htn)}</b></div>`:''}${Object.entries(t.tv).filter(([r])=>+r).map(([r,v])=>`<div><span>TVA ${num(r)} %</span><b>${eur(v)}</b></div>`).join('')}<div class="big"><span>Total TTC</span><span>${eur(t.ttc)}</span></div>${+q.deposit?`<div><span>Acompte ${num(q.deposit)} %</span><b>${eur(t.dep)}</b></div>`:''}`}
function refreshQ(){const q=QUO();if(!q)return;q.lines.forEach(l=>{const el=document.getElementById('la_'+l.id);if(el)el.textContent=eur(lineHT(l))});const t=document.getElementById('qtot');if(t)t.innerHTML=totHtml(q)}
function qset(k,v,re){QUO()[k]=v;save();re?render():refreshQ()}
function lset(lid,k,v){QUO().lines.find(x=>x.id===lid)[k]=v;save();refreshQ()}
function addLine(kind){QUO().lines.push(kind==='title'?{id:uid(),kind:'title',d:''}:newLine());save();render()}
function mvLine(lid,d){const L=QUO().lines,i=L.findIndex(x=>x.id===lid),j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render()}
function delLine(lid){const q=QUO();q.lines=q.lines.filter(x=>x.id!==lid);save();render()}
function lineToArt(lid){const l=QUO().lines.find(x=>x.id===lid);if(!l.d)return toast('Saisissez d\'abord une désignation',1);S.articles.push({id:uid(),d:l.d,u:l.u,p:+l.pu||0,tva:+l.tva});save();toast('Enregistré dans les articles')}
function artList(q){q=(q||'').toLowerCase();const L=S.articles.filter(a=>a.d.toLowerCase().includes(q));return L.length?L.map(a=>`<div class="eq"><div class="grow">${esc(a.d)}<div class="mut sm">${eur(a.p)} HT / ${esc(a.u)}</div></div><button class="btn sm pri" onclick="addArt('${a.id}')">Ajouter</button></div>`).join(''):'<p class="mut">Aucun article trouvé. Créez vos articles dans Paramètres.</p>'}
function pickArt(){openModal('Ajouter depuis les articles',`<input type="search" placeholder="Rechercher un article…" oninput="document.getElementById('artl').innerHTML=artList(this.value)" style="width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--panel)"><div id="artl" class="mt">${artList('')}</div>`,null)}
function addArt(aid){const a=S.articles.find(x=>x.id===aid);QUO().lines.push(newLine({d:a.d,u:a.u,pu:a.p,tva:a.tva??(+S.company.tvaDefault||8.5)}));save();render();toast('Ligne ajoutée')}
function lineActs(l){return `<div class="acts" style="flex-wrap:nowrap"><button class="btn sm ghost" onclick="mvLine('${l.id}',-1)" aria-label="Monter">↑</button><button class="btn sm ghost" onclick="mvLine('${l.id}',1)" aria-label="Descendre">↓</button>${l.kind==='line'?`<button class="btn sm ghost" onclick="lineToArt('${l.id}')" title="Enregistrer comme article">★</button>`:''}<button class="btn sm ghost" onclick="delLine('${l.id}')" aria-label="Supprimer">✕</button></div>`}
function pQuotes(){V.qtab=V.qtab||'Tous';const tabs=['Tous',...Object.keys(QST)];
 const L=S.quotes.filter(q=>V.qtab==='Tous'||qStatus(q)===V.qtab).sort((a,c)=>c.no.localeCompare(a.no));
 const acc=S.quotes.filter(q=>q.status==='Accepté').reduce((a,q)=>a+qTot(q).htn,0),pend=S.quotes.filter(q=>qStatus(q)==='Envoyé').reduce((a,q)=>a+qTot(q).htn,0);
 return head('Devis',`${eur(acc)} HT acceptés · ${eur(pend)} HT en attente de réponse`,`<button class="btn pri" onclick="newQuote()">+ Nouveau devis</button>`)+
 `<div class="tabs">${tabs.map(k=>`<button class="tab ${V.qtab===k?'on':''}" onclick="V.qtab='${k}';render()">${k} (${S.quotes.filter(q=>k==='Tous'||qStatus(q)===k).length})</button>`).join('')}</div>
 <div class="card">${L.length?L.map(q=>{const t=qTot(q),st=qStatus(q);return `<div class="eq"><div class="ico">💶</div><div class="grow"><b>${esc(q.no)}</b> ${esc(q.object||'Sans objet')}<div class="mut sm">${esc(client(q.clientId).name||'Client supprimé')}${q.siteId?' – '+esc(site(q.siteId).name||''):''} · ${fmt(q.date)}</div></div><div class="right"><b>${eur(t.ttc)}</b> <span class="sm mut">TTC</span><div>${b(QST[st],st)}</div></div><div class="acts"><button class="btn sm" onclick="go('quote',{qid:'${q.id}'})">Ouvrir</button><button class="btn sm ghost" onclick="printQuote('${q.id}')" title="Imprimer">🖨️</button><button class="btn sm ghost" onclick="dupQuote('${q.id}')" title="Dupliquer">⧉</button><button class="btn sm ghost" onclick="delQuote('${q.id}')" title="Supprimer">🗑️</button></div></div>`}).join(''):'<div class="empty"><div class="big">💶</div><p class="mut">Aucun devis dans cette liste.</p></div>'}</div>`}
function pQuote(){const q=QUO();if(!q){V.page='quotes';return pQuotes()}
 const cs=S.sites.filter(s=>s.clientId===q.clientId),st=qStatus(q);
 window._after.push(()=>sigG('qsigC',q,'sigC',false));
 const sel='width:100%;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--panel)';
 return `<div class="card"><div class="row between"><div class="grow"><h3>Devis ${esc(q.no)}</h3><div class="mut sm">Valable jusqu'au ${fmt(qExp(q))}</div></div>${b(QST[st],st)}</div>
 <div class="acts mt"><button class="btn sm ghost" onclick="go('quotes')">← Devis</button></div>
 <div class="grid2 mt">
  <label class="fld"><span>Client</span><select onchange="QUO().siteId='';qset('clientId',this.value,1)">${S.clients.map(c=>`<option value="${c.id}" ${c.id===q.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
  <label class="fld"><span>Site d'intervention</span><select onchange="qset('siteId',this.value)"><option value="">—</option>${cs.map(s=>`<option value="${s.id}" ${s.id===q.siteId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
  <label class="fld"><span>Date</span><input type="date" value="${q.date}" onchange="qset('date',this.value,1)"></label>
  <label class="fld"><span>Validité (jours)</span><input type="number" inputmode="numeric" value="${q.validity}" onchange="qset('validity',this.value,1)"></label>
  <label class="fld"><span>Statut</span><select onchange="qset('status',this.value,1)">${['Brouillon','Envoyé','Accepté','Refusé'].map(s=>`<option ${q.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
  <label class="fld"><span>Objet</span><input value="${esc(q.object)}" onchange="qset('object',this.value)" placeholder="Ex : mise en conformité sécurité incendie"></label>
  <label class="fld full"><span>Texte d'introduction</span><textarea rows="2" onchange="qset('intro',this.value)">${esc(q.intro)}</textarea></label></div></div>
 <div class="card"><h3>Prestations et fournitures</h3><div class="tw mt"><table class="lines"><tr><th style="min-width:300px">Désignation</th><th style="width:80px">Qté</th><th style="width:80px">Unité</th><th style="width:110px">PU HT (€)</th><th style="width:80px">Rem. %</th><th style="width:95px">TVA</th><th style="width:110px;text-align:right">Total HT</th><th style="width:150px"></th></tr>
 ${q.lines.map(l=>l.kind==='title'?`<tr><td colspan="7"><input style="font-weight:700" value="${esc(l.d)}" placeholder="Titre de section (ex : Extincteurs)" onchange="lset('${l.id}','d',this.value)"></td><td>${lineActs(l)}</td></tr>`:
 `<tr><td><textarea rows="2" onchange="lset('${l.id}','d',this.value)" placeholder="Désignation de la prestation">${esc(l.d)}</textarea></td><td><input type="number" inputmode="decimal" step="any" value="${l.qty}" onchange="lset('${l.id}','qty',this.value)"></td><td><input value="${esc(l.u)}" onchange="lset('${l.id}','u',this.value)"></td><td><input type="number" inputmode="decimal" step="any" value="${l.pu}" onchange="lset('${l.id}','pu',this.value)"></td><td><input type="number" inputmode="decimal" step="any" value="${l.rem||0}" onchange="lset('${l.id}','rem',this.value)"></td><td><select style="${sel}" onchange="lset('${l.id}','tva',this.value)">${TVAS.map(t=>`<option value="${t}" ${+l.tva===t?'selected':''}>${num(t)} %</option>`).join('')}</select></td><td style="text-align:right;font-weight:700;padding-top:14px" id="la_${l.id}">${eur(lineHT(l))}</td><td>${lineActs(l)}</td></tr>`).join('')}</table></div>
 <div class="acts mt"><button class="btn sm" onclick="addLine()">+ Ligne</button><button class="btn sm" onclick="addLine('title')">+ Titre de section</button><button class="btn sm pri" onclick="pickArt()">📋 Depuis mes articles</button></div>
 <div class="row mt" style="align-items:flex-start"><div class="grid2" style="flex:1;min-width:240px"><label class="fld"><span>Remise globale (%)</span><input type="number" inputmode="decimal" value="${q.disc||0}" onchange="qset('disc',this.value)"></label><label class="fld"><span>Acompte (%)</span><input type="number" inputmode="decimal" value="${q.deposit||0}" onchange="qset('deposit',this.value)"></label></div><div class="tot" id="qtot">${totHtml(q)}</div></div></div>
 <div class="card"><h3>Conditions et bon pour accord</h3>

function legal(){const c=S.company;return [c.name,c.forme,c.capital?'Capital '+c.capital:'',c.siret?'SIRET '+c.siret:'',c.ape?'APE '+c.ape:'',c.tva?'TVA intracom. '+c.tva:'',c.assurance?'RC Pro : '+c.assurance:'',c.iban?'IBAN '+c.iban:''].filter(Boolean).map(esc).join(' – ')}
function printQuote(id){const q=S.quotes.find(x=>x.id===id),c=client(q.clientId),s=q.siteId?site(q.siteId):null,t=qTot(q),co=S.company;const R='style="text-align:right"';

 ${q.intro?`<p style="white-space:pre-line">${esc(q.intro)}</p>`:''}
 <table><tr><th>Désignation</th><th style="width:40px">Qté</th><th style="width:45px">Unité</th><th style="width:70px" ${R}>PU HT</th><th style="width:40px">Rem.</th><th style="width:45px">TVA</th><th style="width:80px" ${R}>Total HT</th></tr>${q.lines.map(l=>l.kind==='title'?`<tr><td colspan="7" style="background:#f0f0f0;font-weight:700">${esc(l.d)}</td></tr>`:`<tr><td style="white-space:pre-line">${esc(l.d)}</td><td>${num(l.qty)}</td><td>${esc(l.u)}</td><td ${R}>${eur(l.pu)}</td><td>${+l.rem?num(l.rem)+' %':''}</td><td>${num(l.tva)} %</td><td ${R}>${eur(lineHT(l))}</td></tr>`).join('')}</table>
 <table style="width:48%;margin-left:auto"><tr><td>Total HT</td><td ${R}>${eur(t.ht)}</td></tr>${t.rem?`<tr><td>Remise ${num(q.disc)} %</td><td ${R}>− ${eur(t.rem)}</td></tr><tr><td>Net HT</td><td ${R}>${eur(t.htn)}</td></tr>`:''}${Object.entries(t.tv).filter(([r])=>+r).map(([r,v])=>`<tr><td>TVA ${num(r)} %</td><td ${R}>${eur(v)}</td></tr>`).join('')}<tr><th>Total TTC</th><th ${R}>${eur(t.ttc)}</th></tr>${+q.deposit?`<tr><td>Acompte à la commande (${num(q.deposit)} %)</td><td ${R}>${eur(t.dep)}</td></tr>`:''}</table>
 ${co.payTerms?`<h2>Conditions de règlement</h2><p style="white-space:pre-line">${esc(co.payTerms)}</p>`:''}${q.notes?`<h2>Conditions particulières</h2><p style="white-space:pre-line">${esc(q.notes)}</p>`:''}
 <h2>Bon pour accord</h2><div class="pr-sig"><div>Date, nom, qualité et signature précédés de la mention « Bon pour accord »<br><b>${esc(q.signer||'')}</b><br>${q.sigC?`<img src="${q.sigC}">`:''}</div><div><b>Pour ${esc(co.name)}</b></div></div>
 <p class="pr-legal">${legal()}</p>`)}
